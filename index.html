<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super Cars Remake</title>
  <style>
    /* Orbitron (SIL Open Font License), a variable font bundled with the game: weights 400 to 900. */
    @font-face { font-family: 'Orbitron'; src: url('/src/assets/fonts/Orbitron.ttf') format('truetype'); font-weight: 400 900; font-display: swap; }
    :root { --font: 'Orbitron', system-ui, sans-serif; }
    html, body { font-family: var(--font); font-synthesis: none; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #111; }
    canvas { display: block; }
    #hpbar { position: fixed; top: 10px; left: 12px; width: 240px; height: 24px; box-sizing: border-box; background: rgba(10, 14, 12, 0.6); border: 1px solid rgba(255, 255, 255, 0.45); border-radius: 4px; overflow: hidden; pointer-events: none; }
    #hpfill { height: 100%; width: 100%; background: #3fcf5a; }
    #hptext { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font: 600 12px var(--font); text-shadow: 0 0 3px #000; }
    #hud { position: fixed; top: 42px; left: 12px; color: #fff; font: 500 12px/1.5 var(--font); text-shadow: 0 0 3px #000; white-space: pre; pointer-events: none; }
    #banner .result { display: flex; flex-direction: column; align-items: center; gap: 14px; white-space: normal; padding: 18px 26px; background: rgba(10, 14, 12, 0.72); border: 1px solid rgba(255, 255, 255, 0.2); }
    #banner h2 { margin: 0; font-size: 34px; letter-spacing: 0.1em; }
    #banner table { border-collapse: collapse; font-size: 17px; min-width: 360px; }
    #banner th { padding: 4px 14px; text-align: left; font-size: 13px; letter-spacing: 0.12em; color: #f0b050; border-bottom: 1px solid rgba(255, 255, 255, 0.3); }
    #banner td { padding: 3px 14px; text-align: left; }
    #banner th:last-child, #banner td.num { text-align: right; }
    #banner tr.me td { color: #f0b050; background: rgba(240, 160, 48, 0.14); }
    #banner tr.total td { font-weight: 800; border-top: 1px solid rgba(255, 255, 255, 0.3); }
    #banner p { margin: 0; font-size: 16px; }
    #banner p.keys { font-size: 14px; color: #b9bfb2; }
    #banner { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; color: #fff; font: 600 24px/1.4 var(--font); text-shadow: 0 0 6px #000, 0 0 2px #000; white-space: pre; pointer-events: none; }
    #gauges { position: fixed; left: 12px; bottom: 12px; display: flex; gap: 10px; pointer-events: none; }
    .dial { width: min(230px, 24vw); min-width: 150px; filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.6)); }
    .dial .face { fill: rgba(10, 14, 12, 0.78); stroke: rgba(255, 255, 255, 0.28); stroke-width: 1.5; }
    .dial .rim { fill: none; stroke: rgba(255, 255, 255, 0.55); stroke-width: 2; }
    .dial .redzone { fill: none; stroke: #e0402a; stroke-width: 5; opacity: 0.85; }
    .dial .tick { stroke: rgba(255, 255, 255, 0.55); stroke-width: 1.2; }
    .dial .tick.major { stroke: #fff; stroke-width: 2; }
    .dial .tick.red { stroke: #ff6a4a; }
    .dial .num { fill: #e6e9e2; font: 600 9px var(--font); text-anchor: middle; }
    .dial .num.red { fill: #ff6a4a; }
    .dial .big { fill: #fff; font: 700 20px var(--font); text-anchor: middle; }
    .dial .unit { fill: #9aa095; font: 500 8px var(--font); text-anchor: middle; }
    .dial .needle { stroke: #ff5a2a; stroke-width: 3; stroke-linecap: round; }
    .dial .hub { fill: #2a2f2b; stroke: #ff5a2a; stroke-width: 2; }
    #popups { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
    .popup { position: absolute; left: 0; top: 0; text-align: center; white-space: nowrap; text-shadow: 0 0 6px #000, 0 2px 0 #000; will-change: transform, opacity; }
    .popup-title { font: 800 24px var(--font); letter-spacing: 0.06em; text-transform: uppercase; }
    .popup-detail { font: 600 15px var(--font); color: #fff; }
    #screen { position: fixed; inset: 0; color: #fff; font: 500 16px/1.35 var(--font); background: radial-gradient(ellipse at center, rgba(8, 12, 10, 0.45), rgba(4, 6, 5, 0.85)); }
    #screen[hidden] { display: none; }
    .screen { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 14px; padding: 24px; box-sizing: border-box; }
    .screen.centre { align-items: center; justify-content: center; text-align: center; }
    .screen.carselect { align-items: flex-start; justify-content: center; background: linear-gradient(90deg, rgba(4, 6, 5, 0.88) 0, rgba(4, 6, 5, 0.6) 380px, transparent 640px); }
    /* The title image is 1920 x 1080 with the lettering at x 499..1422, y 293..714 (923 x 421): show just that part. */
    .logo-crop { position: relative; width: min(940px, 92vw); aspect-ratio: 923 / 421; overflow: hidden; margin-bottom: 6px; filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.55)); pointer-events: none; }
    .logo-crop img { position: absolute; width: calc(100% * 1920 / 923); height: auto; left: calc(-100% * 499 / 923); top: calc(-100% * 293 / 421); max-width: none; user-select: none; }
    h1.logo { margin: 0; font-size: clamp(40px, 9vw, 84px); letter-spacing: 0.12em; text-shadow: 0 0 18px rgba(240, 120, 40, 0.6), 0 3px 0 #000; }
    h2 { margin: 0 0 6px; font-size: 26px; font-weight: 700; letter-spacing: 0.06em; }
    .tagline { margin: 0 0 18px; color: #c9c3a8; font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase; }
    .credit { margin: 22px 0 0; color: #77806f; font-size: 12px; }
    .note { margin: 4px 0; max-width: 520px; color: #b9bfb2; font-size: 13px; }
    .menu { display: flex; flex-direction: column; gap: 10px; width: min(420px, 90vw); }
    .panel { display: flex; flex-direction: column; gap: 10px; width: min(360px, 92vw); }
    .panel.wide { width: min(520px, 92vw); gap: 4px; background: rgba(10, 14, 12, 0.6); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; padding: 14px 18px; text-align: left; }
    .row { display: flex; justify-content: space-between; gap: 18px; font-size: 13px; }
    .row .k { color: #b9bfb2; }
    button { font: inherit; color: #fff; text-align: left; cursor: pointer; padding: 11px 16px; border-radius: 0; position: relative; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.28); background: rgba(24, 30, 26, 0.82); display: flex; flex-direction: column; gap: 2px; }
    /* Chequered-flag edges on hover: --flag-w wide, --flag-sq per square, fading out towards the middle. */
    button { --flag-w: 44px; --flag-sq: 11px; }
    button::before, button::after { content: ''; position: absolute; top: 0; bottom: 0; width: var(--flag-w); pointer-events: none; opacity: 0; transition: opacity 0.15s; background: repeating-conic-gradient(#f4f4f4 0% 25%, #151515 0% 50%) 0 0 / calc(var(--flag-sq) * 2) calc(var(--flag-sq) * 2); }
    button::before { left: 0; -webkit-mask-image: linear-gradient(to right, #000, transparent); mask-image: linear-gradient(to right, #000, transparent); }
    button::after { right: 0; -webkit-mask-image: linear-gradient(to left, #000, transparent); mask-image: linear-gradient(to left, #000, transparent); }
    button:hover:not(:disabled)::before, button:hover:not(:disabled)::after, button:focus-visible::before, button:focus-visible::after { opacity: 0.9; }
    .menu button, .screen.centre button { text-align: center; }
    button .label { font-size: 17px; font-weight: 700; letter-spacing: 0.06em; }
    button .hint { font-size: 12px; color: #b9bfb2; }
    button:hover:not(:disabled), button:focus-visible { outline: none; border-color: #fff; }
    button.selected { border-color: #f0a030; box-shadow: inset 0 0 0 1px #f0a030; }
    button.primary { background: rgba(176, 84, 18, 0.9); border-color: #ffbe5c; }
    .name-field { font: 700 24px var(--font); text-align: center; color: #fff; padding: 12px 14px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.4); background: rgba(10, 14, 12, 0.85); outline: none; }
    .name-field:focus { border-color: #f0a030; box-shadow: 0 0 0 2px rgba(240, 160, 48, 0.4); }
    button:disabled { opacity: 0.45; cursor: default; }
    .screen.shop { padding: 14px 20px 18px; gap: 12px; overflow-y: auto; align-items: stretch; }
    .shop-head { width: 100%; display: flex; justify-content: space-between; align-items: flex-end; gap: 18px; flex-wrap: wrap; }
    .shop-title h2 { margin: 0; font-size: 26px; }
    .shop .sub { color: #b9bfb2; font-size: 13px; }
    .wallet { text-align: right; }
    .wallet .amount { font-size: 28px; font-weight: 800; color: #7be07b; text-shadow: 0 0 12px rgba(80, 200, 80, 0.4); }
    #screen.clear { background: none; }
    .shop-body { width: 100%; display: flex; gap: 20px; align-items: flex-start; }
    .garage-side { order: -1; flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
    .car-window { position: relative; height: clamp(300px, calc(100vh - 340px), 720px); border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.18); background: transparent; box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.35); }
    .car-caption { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; font-weight: bold; letter-spacing: 0.08em; text-shadow: 0 0 6px #000; }
    .palette { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 6px; }
    .swatch { height: 36px; padding: 0; border-radius: 0; border: 2px solid rgba(255, 255, 255, 0.25); box-shadow: inset 0 -10px 14px rgba(0, 0, 0, 0.25); }
    .swatch:hover, .swatch:focus-visible { border-color: #fff; transform: scale(1.06); }
    .swatch.selected { border-color: #fff; box-shadow: 0 0 0 3px #f0a030, inset 0 -10px 14px rgba(0, 0, 0, 0.25); }
    .tiles { flex: none; width: 40vw; min-width: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .screen.tracks { padding: 16px 22px 22px; gap: 14px; overflow-y: auto; align-items: stretch; }
    .screen.tracks .shop-head button { flex: none; min-width: 120px; align-items: center; }
    .track-tiles { width: 100%; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .track-tile { position: relative; aspect-ratio: 1 / 1; padding: 0; overflow: hidden; display: flex; flex-direction: column; text-align: left; border-radius: 0; }
    .track-art { flex: 1; min-height: 0; width: 100%; display: grid; place-items: center; padding: 8px; box-sizing: border-box; }
    .track-art svg { width: 100%; height: 100%; }
    .track-info { padding: 8px 12px 10px; background: rgba(8, 12, 10, 0.78); }
    .track-name { font-size: 17px; font-weight: 700; letter-spacing: 0.04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-meta { font-size: 12px; color: #c9cfc4; margin-top: 2px; }
    .track-desc { display: none; } /* too much text at this size: the description is the tile's tooltip */
    .track-badge { position: absolute; right: 8px; top: 8px; padding: 2px 8px; font-size: 12px; border-radius: 0; background: rgba(240, 160, 48, 0.9); color: #1a1208; }
    .theme-grass { background: radial-gradient(circle at 50% 40%, #3f7a3a, #274a24); }
    .theme-snow { background: radial-gradient(circle at 50% 40%, #e8eff7, #b4c6da); }
    .theme-mountain { background: radial-gradient(circle at 50% 40%, #7b7466, #4d493f); }
    .setting-row { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
    .setting-label { font-size: 17px; font-weight: 700; letter-spacing: 0.04em; }
    .pills { display: flex; gap: 8px; }
    .pill { flex-direction: row; border-radius: 0; padding: 8px 22px; font-weight: 700; font-size: 15px; letter-spacing: 0.04em; background: rgba(24, 30, 26, 0.82); }
    .pill.selected { background: #a85414; border-color: #ffbe5c; box-shadow: none; }
    .tile.soon { opacity: 0.55; border-style: dashed; }
    .tile { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 10px 9px 9px; text-align: center; background: linear-gradient(180deg, rgba(34, 42, 36, 0.92), rgba(16, 20, 17, 0.92)); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 12px; }
    .tile.maxed { border-color: #d8b24a; box-shadow: inset 0 0 0 1px rgba(216, 178, 74, 0.5); }
    .tile .art { display: grid; place-items: center; width: 64px; height: 64px; border-radius: 50%; color: #f0b050; background: radial-gradient(circle, rgba(240, 160, 48, 0.2), rgba(240, 160, 48, 0.02) 70%); border: 1px solid rgba(240, 160, 48, 0.35); }
    .tile.maxed .art { color: #ffd66b; }
    .tile .art svg { width: 40px; height: 40px; }
    .tile .name { font-size: 14px; font-weight: 700; letter-spacing: 0.05em; }
    .pips { display: flex; gap: 6px; }
    .pip { width: 20px; height: 6px; border-radius: 4px; background: rgba(255, 255, 255, 0.16); }
    .pip.on { background: #f0a030; box-shadow: 0 0 6px rgba(240, 160, 48, 0.7); }
    .effect { display: flex; flex-direction: column; gap: 2px; }
    .effect .stat { color: #b9bfb2; font-size: 11px; }
    .effect .change { font-size: 13px; font-weight: 700; }
    .tile .blurb { display: none; } /* the tile's tooltip */
    .tile button { width: 100%; align-items: center; margin-top: auto; padding: 6px 8px; }
    .tile button .label { font-size: 12px; }
    .shop-foot { width: 100%; display: flex; justify-content: space-between; gap: 14px; margin-top: 4px; }
    .shop-foot button { flex: 0 1 380px; align-items: center; }
    .shop-foot button.primary { flex-basis: 480px; }
  </style>
</head>
<body>
  <div id="hpbar"><div id="hpfill"></div><div id="hptext"></div></div>
  <div id="hud"></div>
  <div id="banner"></div>
  <div id="screen"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
