<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super Cars Remake</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #111; }
    canvas { display: block; }
    #hpbar { position: fixed; top: 10px; left: 12px; width: 240px; height: 18px; box-sizing: border-box; background: rgba(10, 14, 12, 0.6); border: 1px solid rgba(255, 255, 255, 0.45); border-radius: 4px; overflow: hidden; pointer-events: none; }
    #hpfill { height: 100%; width: 100%; background: #3fcf5a; }
    #hptext { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font: bold 12px monospace; text-shadow: 0 0 3px #000; }
    #hud { position: fixed; top: 36px; left: 12px; color: #fff; font: 14px/1.4 monospace; text-shadow: 0 0 3px #000; white-space: pre; pointer-events: none; }
    #banner { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; color: #fff; font: bold 28px/1.5 monospace; text-shadow: 0 0 6px #000, 0 0 2px #000; white-space: pre; pointer-events: none; }
    #gauges { position: fixed; left: 12px; bottom: 12px; display: flex; gap: 10px; pointer-events: none; }
    .dial { width: min(230px, 24vw); min-width: 150px; filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.6)); }
    .dial .face { fill: rgba(10, 14, 12, 0.78); stroke: rgba(255, 255, 255, 0.28); stroke-width: 1.5; }
    .dial .rim { fill: none; stroke: rgba(255, 255, 255, 0.55); stroke-width: 2; }
    .dial .redzone { fill: none; stroke: #e0402a; stroke-width: 5; opacity: 0.85; }
    .dial .tick { stroke: rgba(255, 255, 255, 0.55); stroke-width: 1.2; }
    .dial .tick.major { stroke: #fff; stroke-width: 2; }
    .dial .tick.red { stroke: #ff6a4a; }
    .dial .num { fill: #e6e9e2; font: bold 10px monospace; text-anchor: middle; }
    .dial .num.red { fill: #ff6a4a; }
    .dial .big { fill: #fff; font: bold 22px monospace; text-anchor: middle; }
    .dial .unit { fill: #9aa095; font: 9px monospace; text-anchor: middle; }
    .dial .needle { stroke: #ff5a2a; stroke-width: 3; stroke-linecap: round; }
    .dial .hub { fill: #2a2f2b; stroke: #ff5a2a; stroke-width: 2; }
    #popups { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
    .popup { position: absolute; left: 0; top: 0; text-align: center; white-space: nowrap; text-shadow: 0 0 6px #000, 0 2px 0 #000; will-change: transform, opacity; }
    .popup-title { font: bold 26px monospace; letter-spacing: 0.06em; text-transform: uppercase; }
    .popup-detail { font: bold 17px monospace; color: #fff; }
    #screen { position: fixed; inset: 0; color: #fff; font: 16px/1.4 monospace; background: radial-gradient(ellipse at center, rgba(8, 12, 10, 0.45), rgba(4, 6, 5, 0.85)); }
    #screen[hidden] { display: none; }
    .screen { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 14px; padding: 24px; box-sizing: border-box; }
    .screen.centre { align-items: center; justify-content: center; text-align: center; }
    .screen.carselect { align-items: flex-start; justify-content: center; background: linear-gradient(90deg, rgba(4, 6, 5, 0.88) 0, rgba(4, 6, 5, 0.6) 380px, transparent 640px); }
    h1.logo { margin: 0; font-size: clamp(40px, 9vw, 84px); letter-spacing: 0.12em; text-shadow: 0 0 18px rgba(240, 120, 40, 0.6), 0 3px 0 #000; }
    h2 { margin: 0 0 6px; font-size: 26px; letter-spacing: 0.06em; }
    .tagline { margin: 0 0 18px; color: #c9c3a8; font-size: 18px; }
    .note { margin: 4px 0; max-width: 460px; color: #b9bfb2; font-size: 14px; }
    .menu { display: flex; flex-direction: column; gap: 10px; width: min(420px, 90vw); }
    .panel { display: flex; flex-direction: column; gap: 10px; width: min(360px, 92vw); }
    .panel.wide { width: min(520px, 92vw); gap: 4px; background: rgba(10, 14, 12, 0.6); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; padding: 14px 18px; text-align: left; }
    .row { display: flex; justify-content: space-between; gap: 18px; font-size: 15px; }
    .row .k { color: #b9bfb2; }
    button { font: inherit; color: #fff; text-align: left; cursor: pointer; padding: 11px 16px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.28); background: rgba(24, 30, 26, 0.82); display: flex; flex-direction: column; gap: 2px; }
    .menu button, .screen.centre button { text-align: center; }
    button .label { font-weight: bold; font-size: 18px; letter-spacing: 0.04em; }
    button .hint { font-size: 12px; color: #b9bfb2; font-weight: normal; }
    button:hover:not(:disabled), button:focus-visible { outline: none; border-color: #f0a030; background: rgba(60, 44, 18, 0.9); }
    button.selected { border-color: #f0a030; box-shadow: inset 0 0 0 1px #f0a030; }
    button.primary { background: rgba(176, 84, 18, 0.9); border-color: #ffbe5c; }
    button.primary:hover:not(:disabled), button.primary:focus-visible { background: rgba(214, 108, 26, 0.95); }
    .name-field { font: bold 24px monospace; text-align: center; color: #fff; padding: 12px 14px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.4); background: rgba(10, 14, 12, 0.85); outline: none; }
    .name-field:focus { border-color: #f0a030; box-shadow: 0 0 0 2px rgba(240, 160, 48, 0.4); }
    button:disabled { opacity: 0.45; cursor: default; }
    .screen.shop { padding: 14px 20px 18px; gap: 12px; overflow-y: auto; align-items: stretch; }
    .shop-head { width: 100%; display: flex; justify-content: space-between; align-items: flex-end; gap: 18px; flex-wrap: wrap; }
    .shop-title h2 { margin: 0; font-size: 28px; }
    .shop .sub { color: #b9bfb2; font-size: 14px; }
    .wallet { text-align: right; }
    .wallet .amount { font-size: 32px; font-weight: bold; color: #7be07b; text-shadow: 0 0 12px rgba(80, 200, 80, 0.4); }
    #screen.clear { background: none; }
    .shop-body { width: 100%; display: flex; gap: 20px; align-items: flex-start; }
    .garage-side { order: -1; flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
    .car-window { position: relative; height: clamp(300px, calc(100vh - 340px), 720px); border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.18); background: transparent; box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.35); }
    .car-caption { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; font-weight: bold; letter-spacing: 0.08em; text-shadow: 0 0 6px #000; }
    .palette { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 6px; }
    .swatch { height: 36px; padding: 0; border-radius: 10px; border: 2px solid rgba(255, 255, 255, 0.25); box-shadow: inset 0 -10px 14px rgba(0, 0, 0, 0.25); }
    .swatch:hover, .swatch:focus-visible { border-color: #fff; transform: scale(1.06); }
    .swatch.selected { border-color: #fff; box-shadow: 0 0 0 3px #f0a030, inset 0 -10px 14px rgba(0, 0, 0, 0.25); }
    .tiles { flex: none; width: 40vw; min-width: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .screen.tracks { padding: 16px 22px 22px; gap: 14px; overflow-y: auto; align-items: stretch; }
    .screen.tracks .shop-head button { flex: none; min-width: 120px; align-items: center; }
    .track-tiles { width: 100%; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .track-tile { position: relative; aspect-ratio: 1 / 1; padding: 0; overflow: hidden; display: flex; flex-direction: column; text-align: left; border-radius: 12px; }
    .track-art { flex: 1; min-height: 0; width: 100%; display: grid; place-items: center; padding: 8px; box-sizing: border-box; }
    .track-art svg { width: 100%; height: 100%; }
    .track-info { padding: 8px 12px 10px; background: rgba(8, 12, 10, 0.78); }
    .track-name { font-size: 18px; font-weight: bold; letter-spacing: 0.04em; }
    .track-meta { font-size: 12px; color: #c9cfc4; margin-top: 2px; }
    .track-desc { font-size: 11px; color: #98a094; margin-top: 4px; line-height: 1.25; max-height: 2.5em; overflow: hidden; }
    .track-badge { position: absolute; right: 8px; top: 8px; padding: 2px 8px; font-size: 11px; border-radius: 10px; background: rgba(240, 160, 48, 0.9); color: #1a1208; font-weight: bold; }
    .theme-grass { background: radial-gradient(circle at 50% 40%, #3f7a3a, #274a24); }
    .theme-snow { background: radial-gradient(circle at 50% 40%, #e8eff7, #b4c6da); }
    .theme-mountain { background: radial-gradient(circle at 50% 40%, #7b7466, #4d493f); }
    .setting-row { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
    .setting-label { font-size: 18px; font-weight: bold; letter-spacing: 0.04em; }
    .pills { display: flex; gap: 8px; }
    .pill { flex-direction: row; border-radius: 999px; padding: 8px 22px; font-weight: bold; letter-spacing: 0.04em; background: rgba(24, 30, 26, 0.82); }
    .pill.selected { background: #a85414; border-color: #ffbe5c; box-shadow: none; }
    .pill.selected:hover:not(:disabled), .pill.selected:focus-visible { background: #c4661c; }
    .tile.soon { opacity: 0.55; border-style: dashed; }
    .tile { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 10px 9px 9px; text-align: center; background: linear-gradient(180deg, rgba(34, 42, 36, 0.92), rgba(16, 20, 17, 0.92)); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 12px; }
    .tile.maxed { border-color: #d8b24a; box-shadow: inset 0 0 0 1px rgba(216, 178, 74, 0.5); }
    .tile .art { display: grid; place-items: center; width: 64px; height: 64px; border-radius: 50%; color: #f0b050; background: radial-gradient(circle, rgba(240, 160, 48, 0.2), rgba(240, 160, 48, 0.02) 70%); border: 1px solid rgba(240, 160, 48, 0.35); }
    .tile.maxed .art { color: #ffd66b; }
    .tile .art svg { width: 40px; height: 40px; }
    .tile .name { font-size: 16px; font-weight: bold; letter-spacing: 0.05em; }
    .pips { display: flex; gap: 6px; }
    .pip { width: 20px; height: 6px; border-radius: 4px; background: rgba(255, 255, 255, 0.16); }
    .pip.on { background: #f0a030; box-shadow: 0 0 6px rgba(240, 160, 48, 0.7); }
    .effect { display: flex; flex-direction: column; gap: 2px; }
    .effect .stat { color: #b9bfb2; font-size: 11px; }
    .effect .change { font-size: 14px; font-weight: bold; }
    .tile .blurb { color: #98a094; font-size: 11px; line-height: 1.25; min-height: 3.7em; }
    .tile button { width: 100%; align-items: center; margin-top: auto; padding: 6px 8px; }
    .tile button .label { font-size: 13px; }
    .shop-foot { width: 100%; display: flex; justify-content: space-between; gap: 14px; margin-top: 4px; }
    .shop-foot button { flex: 0 1 380px; align-items: center; }
    .shop-foot button.primary { flex-basis: 480px; }
  </style>
</head>
<body>
  <div id="hpbar"><div id="hpfill"></div><div id="hptext"></div></div>
  <div id="hud"></div>
  <div id="banner"></div>
  <div id="screen"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
